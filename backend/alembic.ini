# A generic, single database configuration.

[alembic]
# path to migration scripts.  Alembic will look for scripts under this
# directory hierarchy and use ``env.py`` and ``script.py.mako`` from here.
script_location = alembic

# template used to generate migration file names; the default value is
# %%%(rev)s_%%%(slug)s
# Uncomment the line below if you want Alembic to use a different naming
# convention.  The format string is passed to Python's ``strftime``.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# The output encoding used when revision files are written from within
# Python 3.6+.  Alembic's default is ``utf-8``.
# output_encoding = utf-8

# Default value for ``sqlalchemy.url`` that will be used when the config
# file does not have a ``sqlalchemy.url`` value set.  In practice this
# is only used as a fallback when ``env.py`` does not set the URL.
# We set it in ``env.py`` from ``app.core.config`` so this is a safe fallback.
# sqlalchemy.url = postgresql+psycopg://postgres:password@localhost:5432/lexisgraph

# Enable verbose logging (SQL statements printed to stdout).
# Uncomment to see full SQL being emitted by autogenerate.
# verbose = True

# Enable the "don't prompt for confirmation on drop" behaviour.
# abort_divergent = False

# Controls whether Alembic will pre/append a sys.path entry with the
# script location.  This allows relative imports inside env.py to
# resolve ``app`` cleanly without requiring callers to ``cd backend``.
prepend_sys_path = .

# version table name.  The default is ``alembic_version``.
# version_table = alembic_version

[post_write_hooks]
# Uncomment the block below to enable black formatting on generated migration
# files (requires black to be installed).
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S